<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Cards</title>
    <style>
        body {
    border: 5px solid black;
    padding: 40px ;
}

.container {
    display: flex;
}

.card {
    text-align: center;
    margin: auto;
    background-color: white;
    box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
    width: 150px;
    height: 250px;
    align-content: center;
    
}

.circle {
    width: 70px;
    height: 70px;
    background: #0a7ffb;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    margin: 0 auto 15px auto;
    font-size: 18px;
}

    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="circle">JK</div>
        <h3>Jeet Kumar</h3>
        <p>B.Tech - CSE</p>
        <p>Roll No: 21CS1007</p>
        <p>1st Year</p>
    </div>

    <div class="card">
        <div class="circle">AR</div>
        <h3>Asha Rani</h3>
        <p>B.Tech - IT</p>
        <p>Roll No: 21IT1012</p>
        <p>1st Year</p>
    </div>

    <div class="card">
        <div class="circle">RK</div>
        <h3>Rohit Kumar</h3>
        <p>B.Tech - ECE</p>
        <p>Roll No: 21EC1009</p>
        <p>1st Year</p>
    </div>
</div>

</body>
</html>
