<!DOCTYPE html>
<html>
<head>
    <title>Hotel Booking Form</title>
</head>

<body style="background-color:blue; display: flex;flex-direction: column; align-items: center;">
        <h1 style="color: red;">Hotel Room Booking Form</h1><br>

        <input type="text" placeholder="Enter Your Name" style="border: 1px solid #777;">
        <input type="email" placeholder="Enter Your Email" style="border: 1px solid #777;">
        <input type="tel" placeholder="Enter Your Phone Number" style="border: 1px solid #777;">

        <select style="border: 1px solid #777;">
            <option value="">Select Room Type</option>
            <option>King Size</option>
            <option>Queen Size</option>
            <option>Kid Size</option>
        </select>

        <button type="submit" style="background: red; border: none; color: white;">Book Now</button>
        <button type="reset" style="background: red; border: none; color: white;">Reset</button>
    </body>
</html>
